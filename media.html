<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Media — WannabeGM Hockey League</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<link rel="stylesheet" href="wannabegm.css">
<style>
  /* Page-specific: draft-mix "show track details" toggle, not part of the shared theme */
  .toggle-image-btn{font:inherit;font-family:var(--display);font-weight:400;font-size:14px;letter-spacing:.3px;cursor:pointer;border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:8px 16px;border-radius:999px;margin-top:8px}
  .toggle-image-btn:hover{border-color:var(--accent)}
  .image-container{margin-top:12px}
  .draft-mix{margin-bottom:1.4rem}
  .draft-mix:last-of-type{margin-bottom:0}
  .draft-mix h3{font-family:var(--display);font-weight:400;font-size:1.05rem;margin:0}
</style>
</head>
<body>
<header><div class="wrap bar">
  <a class="brand" href="index.html" aria-label="WannabeGM home"><span class="brandplate"><img src="wannabegm-logo-transparent.png" alt="WannabeGM"></span></a>
  <nav>
    <a href="index.html">Home</a>
    <a href="links.html">Links</a>
    <a href="keepers.html">Keepers</a>
    <a href="awards.html">Awards</a>
    <a href="media.html" class="active">Media</a>
    <a href="fame.html">Hall of Fame</a>
  </nav>
</div></header>

<div class="wrap">
  <section>
    <div class="head"><h2>Media</h2></div>
    <div class="divider"></div>
    <div class="card">
      <div class="draft-mix">
        <h3>
          <a href="https://mega.nz/file/cwdmXK5Y#9K0VewAEcJIUU4vnQOaDEPbrKWJw_QuD7WyBaMOKnsw" target="_blank">Draft Day 2025 Mix</a>
        </h3>
        <button class="toggle-image-btn" onclick="toggleImage('trackImageContainer2025', this)">Show Track Details</button>
        <div class="image-container" id="trackImageContainer2025">
          <img src="Draft Day Mix 2025.png" alt="Track Details for Draft Day 2025 Mix">
        </div>
      </div>
      <div class="draft-mix">
        <h3>
          <a href="https://mega.nz/file/95tySBqQ#C1GBaKQ7iw_gt66llZPO-xGGwPeWiGEPInIPOOTPwlM" target="_blank">Draft Day 2024 Mix</a>
        </h3>
        <button class="toggle-image-btn" onclick="toggleImage('trackImageContainer2024', this)">Show Track Details</button>
        <div class="image-container" id="trackImageContainer2024">
          <img src="Draft Day Mix 2024.png" alt="Track Details for Draft Day 2024 Mix">
        </div>
      </div>
      <div class="draft-mix">
        <h3>
          <a href="https://mega.nz/file/15dAjaaZ#m78jP4EEsDNvzRvHndL-wUwVpEiP2xQ9d1YZEz9kHW8" target="_blank">Draft Day 2023 Mix</a>
        </h3>
      </div>
      <div class="draft-mix">
        <h3>
          <a href="https://mega.nz/file/V0sQ1DwZ#E1Cm7pg9zCmgi7lzQIS3_stPuFlMA6wOvbMW35jwEgY" target="_blank">Draft Day 2022 Mix</a>
        </h3>
      </div>
      <div class="draft-mix">
        <h3>
          <a href="https://mega.nz/file/hp02FaZR#8rqVB7vR9nf90CTvOxyITnksU-qjzTO-AiJH0Z0KqFI" target="_blank">Draft Day 2019 Mix</a>
        </h3>
      </div>
      <div class="draft-mix">
        <h3>
          <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" target="_blank" title="Official WannabeGM Youtube Channel Link">Official WannabeGM Youtube Channel Link</a>
        </h3>
      </div>
    </div>
  </section>
</div>

<footer><div class="wrap">WannabeGM Hockey League &middot; Season 23 &middot; Maintained by Harrington</div></footer>
<script>
    function toggleImage(id, button) {
        const container = document.getElementById(id);
        const isExpanded = container.style.display === 'none' || container.style.display === '';
        container.style.display = isExpanded ? 'block' : 'none';
        button.textContent = isExpanded ? 'Hide Track Details' : 'Show Track Details';
        button.setAttribute('aria-expanded', isExpanded ? 'true' : 'false');
    }

    document.addEventListener('DOMContentLoaded', function() {
        document.querySelectorAll('.image-container').forEach(function(el) {
            el.style.display = 'none';
        });
    });
</script>
</body>
</html>
